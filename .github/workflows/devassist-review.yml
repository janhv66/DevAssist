name: DevAssist AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger DevAssist review
        run: |
          curl -X POST \
            "${{ secrets.DEVASSIST_API_URL }}/api/github/repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/pulls/${{ github.event.pull_request.number }}/review"