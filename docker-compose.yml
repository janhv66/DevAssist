services:
  postgres:
    image: postgres:15
    container_name: devassist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devassist
      POSTGRES_USER: devassist
      POSTGRES_PASSWORD: devassist
    ports:
      - "5432:5432"
    volumes:
      - devassist-postgres-data:/var/lib/postgresql/data

volumes:
  devassist-postgres-data: